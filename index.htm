<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Recurring Deposit Calculator</h2>

        <div class="calculation-grid">

            <div class="calc-section">
                <div class="input-group">
                    <label for="monthlyDeposit">Monthly RD Amount (₹):</label>
                    <input type="number" id="monthlyDeposit" min="1000" placeholder="Enter monthly deposit (e.g., 1000 or more)">
                </div>

                <div class="result-group">
                    <h3>Projected Maturity (1 to 5 Years)</h3>
                    <div id="maturityResultsTableContainer">
                    </div>
                </div>
            </div>

            <div class="vertical-separator"></div>

            <div class="calc-section">
                <div class="input-group">
                    <label for="targetAmount">Goal Fund (₹):</label>
                    <input type="number" id="targetAmount" min="1000" placeholder="Enter target maturity amount (e.g., 5,00,000)">
                </div>
                
                <div class="result-group">
                    <h3 id="goalFundHeading">Required Monthly Deposit (1 to 5 Years)</h3>
                    <div id="depositResultsTableContainer">
                    </div>
                </div>
            </div>

        </div>

        <div class="action-buttons-row" id="actionButtonsRow" style="display:none;">
            <button id="downloadButton" class="download-button">
                <span class="download-icon">&#8681;</span> Download Presentation
            </button>

            <button id="whatsappShareButton" class="whatsapp-share-button">
                <span class="whatsapp-icon">&#128242;</span> Share to WhatsApp
            </button>
        </div>

        <button id="clearButton" class="clear-button" style="display:none;">Clear All</button>

    </div>

    <style>
        .action-buttons-row{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            justify-content:center;
            margin-top:16px;
        }
        .whatsapp-share-button{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:12px 22px;
            border:none;
            border-radius:8px;
            background:linear-gradient(135deg,#3FD67A,#25C15A);
            color:#04220F;
            font-weight:700;
            font-size:1rem;
            cursor:pointer;
            box-shadow:0 4px 14px rgba(37,193,90,0.35);
            transition:filter 0.2s ease;
        }
        .whatsapp-share-button:hover{ filter:brightness(1.06); }
        .whatsapp-icon{ font-size:1.1em; }
    </style>

    <script src="script.js"></script>
</body>
</html>
